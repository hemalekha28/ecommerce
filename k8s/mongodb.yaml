# --- STORAGE CLASS ---
# Tells K8s how to create the physical "Hard Drive"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # Reserve 1GB of space for products/users

---
# --- MONGODB SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: mern-mongodb
spec:
  selector:
    app: mern-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# --- MONGODB STATEFULSET ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mern-mongodb
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mern-mongodb
  template:
    metadata:
      labels:
        app: mern-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db # Connect the database folder to our disk
  volumeClaimTemplates:
  - metadata:
      name: mongo-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
