# --- BACKEND DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-api
spec:
  replicas: 2 # Always keep 2 copies running for reliability
  selector:
    matchLabels:
      app: mern-api # This connects the Deployment to the Pods
  template:
    metadata:
      labels:
        app: mern-api
    spec:
      containers:
      - name: mern-api
        image: mern-api:latest # Use your built image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mern-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mern-secrets
              key: jwt-secret
        - name: RAZORPAY_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mern-secrets
              key: razorpay-key-id
        - name: RAZORPAY_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: mern-secrets
              key: razorpay-key-secret
---
# --- BACKEND SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: mern-api
spec:
  selector:
    app: mern-api # Directs traffic to any pod with the 'mern-api' label
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP # Internal IP only (Frontend talks to this)

---
# --- FRONTEND DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mern-frontend
  template:
    metadata:
      labels:
        app: mern-frontend
    spec:
      containers:
      - name: mern-frontend
        image: mern-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

---
# --- FRONTEND SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: mern-frontend
spec:
  selector:
    app: mern-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer # Makes the website accessible to the outside world

---
# --- HORIZONTAL POD AUTOSCALER (HPA) ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mern-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mern-api
  minReplicas: 2
  maxReplicas: 10 # Scale up to 10 pods during high traffic (Flash Sale!)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale up if CPU goes above 70%
